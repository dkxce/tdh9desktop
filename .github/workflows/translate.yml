name: Auto Translate README to English

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'DISASM/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Устанавливаем полностью офлайновую библиотеку перевода
      - name: Install Argos Translate
        run: |
          pip install argostranslate

      # 2. Скачиваем языковую модель RU -> EN и выполняем перевод локально
      - name: Translate README via Argos (Offline)
        run: |
          python -c "
          import argostranslate.package
          import argostranslate.translate
          import os

          # Обновляем индекс пакетов и скачиваем модель с русского на английский
          argostranslate.package.update_package_index()
          available_packages = argostranslate.package.get_available_packages()
          package_to_install = next(
              filter(
                  lambda x: x.from_code == 'ru' and x.to_code == 'en',
                  available_packages
              )
          )
          argostranslate.package.install_from_path(package_to_install.download())

          # Функция для перевода одного файла
          def translate_file(src, dest):
              if not os.path.exists(src):
                  return
              with open(src, 'r', encoding='utf-8') as f:
                  text = f.read()
              translated_text = argostranslate.translate.translate(text, 'ru', 'en')
              with open(dest, 'w', encoding='utf-8') as f:
                  f.write(translated_text)

          # Переводим оба файла
          translate_file('README.md', 'README.en.md')
          translate_file('DISASM/README.md', 'DISASM/README.en.md')
          "

      # 3. Сохраняем готовые файлы в репозиторий
      - name: Commit & Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add README.en.md DISASM/README.en.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-translate READMEs to English"
          git push
